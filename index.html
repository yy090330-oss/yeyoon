<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>보행자 위험 구간 기록 및 안전 지도</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f2f7fc;
  color: #263849;
}

header {
  background: #dceeff;
  padding: 25px 15px;
  text-align: center;
}

header h1 {
  margin: 0 0 8px;
  font-size: 25px;
}

header p {
  margin: 0;
  color: #526d85;
  font-size: 14px;
}

.container {
  max-width: 1100px;
  margin: 25px auto;
  padding: 0 15px;
}

.card {
  background: white;
  padding: 20px;
  margin-bottom: 18px;
  border-radius: 14px;
  box-shadow: 0 3px 12px #dce6ef;
}

h2 {
  font-size: 19px;
  margin: 0 0 16px;
}

input, select, textarea, button {
  width: 100%;
  padding: 11px;
  margin: 6px 0 12px;
  border: 1px solid #cbd9e6;
  border-radius: 8px;
  font-size: 14px;
}

textarea {
  resize: vertical;
  min-height: 65px;
}

button {
  background: #579bd8;
  color: white;
  border: none;
  cursor: pointer;
  font-weight: bold;
}

button:hover {
  background: #397fbd;
}

.search-row {
  display: flex;
  gap: 8px;
}

.search-row input {
  flex: 1;
}

.search-row button {
  width: 90px;
}

#map {
  height: 420px;
  border-radius: 10px;
  z-index: 1;
}

.info {
  font-size: 13px;
  color: #71869a;
  margin: 8px 0;
}

.stats {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.stat {
  background: #eaf4ff;
  padding: 17px;
  border-radius: 10px;
  text-align: center;
}

.stat strong {
  display: block;
  font-size: 25px;
  color: #347fbd;
  margin-top: 7px;
}

.record {
  border: 1px solid #e0e8ef;
  border-radius: 10px;
  padding: 13px;
  margin: 10px 0;
}

.record-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}

.record button {
  width: auto;
  padding: 7px 12px;
  margin: 0;
  background: #e87575;
}

.low { color: #329b65; }
.medium { color: #d99a32; }
.high { color: #dc5555; }

.analysis-item {
  background: #f2f7fc;
  padding: 12px;
  border-radius: 8px;
  margin: 9px 0;
  font-size: 14px;
}

@media (max-width: 600px) {
  header h1 { font-size: 21px; }
  #map { height: 350px; }
  .card { padding: 15px; }
}
</style>
</head>

<body>

<header>
  <h1>보행자 위험 구간 기록 및 안전 지도</h1>
  <p>우리 주변의 보행 위험 요소를 기록하고 분석하는 지도</p>
</header>

<div class="container">

  <section class="card">
    <h2>위험 구간 등록</h2>

    <label>장소</label>
    <input id="place" placeholder="예: 서원고등학교 앞 횡단보도">

    <label>위험 유형</label>
    <select id="type">
      <option value="">위험 유형 선택</option>
      <option>횡단보도</option>
      <option>차량 통행량</option>
      <option>좁은 보도</option>
      <option>시야 확보 문제</option>
      <option>도로 시설물</option>
      <option>기타</option>
    </select>

    <label>위험 정도</label>
    <select id="severity">
      <option value="">위험 정도 선택</option>
      <option value="1">낮음</option>
      <option value="2">보통</option>
      <option value="3">높음</option>
    </select>

    <label>상세 내용</label>
    <textarea id="memo" placeholder="위험한 이유나 주변 상황을 입력하세요."></textarea>

    <p class="info">지도에서 위치를 클릭하거나 주소를 검색해 위치를 선택하세요.</p>
    <p id="selectedInfo" class="info">선택된 위치가 없습니다.</p>

    <button onclick="addRecord()">위험 구간 등록하기</button>
  </section>

  <section class="card">
    <h2>위험 구간 지도</h2>

    <div class="search-row">
      <input id="address" placeholder="주소 또는 장소 검색">
      <button onclick="searchAddress()">검색</button>
    </div>

    <div id="map"></div>

    <p class="info">
      ● 낮음 &nbsp; <span class="medium">●</span> 보통 &nbsp;
      <span class="high">●</span> 높음
    </p>
  </section>

  <section class="card">
    <h2>위험 현황</h2>

    <div class="stats">
      <div class="stat">
        전체 기록 수
        <strong id="totalCount">0</strong>
      </div>
      <div class="stat">
        높은 위험 기록 수
        <strong id="highCount">0</strong>
      </div>
    </div>
  </section>

  <section class="card">
    <h2>위험 우선순위 분석</h2>
    <div id="analysis">아직 등록된 기록이 없습니다.</div>
  </section>

  <section class="card">
    <h2>등록된 위험 기록</h2>
    <div id="recordList">등록된 기록이 없습니다.</div>
    <button onclick="downloadCSV()">CSV 파일 저장</button>
    <button onclick="deleteAll()" style="background:#e87575;">전체 기록 삭제</button>
  </section>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
// 지도 기본 위치
const schoolAddress = "경기도 용인시 수지구 상현로42번길 26-7";

const map = L.map("map").setView([37.3000, 127.0780], 17);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
}).addTo(map);

// 선택한 위치
let selectedLocation = null;
let selectedMarker = null;
let recordMarkers = [];

let records = JSON.parse(localStorage.getItem("pedestrianSafetyRecords") || "[]");

// 주소 검색
async function getCoordinates(address) {
  const url = "https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&accept-language=ko&q="
    + encodeURIComponent(address);

  const response = await fetch(url);
  if (!response.ok) throw new Error("주소 검색에 실패했습니다.");

  const data = await response.json();
  if (!data.length) throw new Error("검색 결과가 없습니다.");

  return {
    lat: Number(data[0].lat),
    lon: Number(data[0].lon)
  };
}

// 학교 주변으로 지도 이동
async function setSchoolLocation() {
  try {
    const location = await getCoordinates(schoolAddress);
    map.setView([location.lat, location.lon], 17);
  } catch (error) {
    console.log("기본 지도 위치를 불러오지 못했습니다.", error);
  }
}

setSchoolLocation();

// 지도 클릭으로 위치 선택
map.on("click", function(e) {
  setLocation(e.latlng.lat, e.latlng.lng);
});

function setLocation(lat, lon) {
  selectedLocation = { lat, lon };

  if (selectedMarker) {
    map.removeLayer(selectedMarker);
  }

  selectedMarker = L.marker([lat, lon]).addTo(map);
  document.getElementById("selectedInfo").textContent =
    "위도: " + lat.toFixed(6) + " / 경도: " + lon.toFixed(6);
}

// 주소 검색 버튼
async function searchAddress() {
  const address = document.getElementById("address").value.trim();

  if (!address) {
    alert("검색할 주소를 입력하세요.");
    return;
  }

  try {
    const location = await getCoordinates(address);
    map.setView([location.lat, location.lon], 17);
    setLocation(location.lat, location.lon);
  } catch (error) {
    alert(error.message || "주소를 검색할 수 없습니다.");
  }
}

// 위험 기록 등록
function addRecord() {
  const place = document.getElementById("place").value.trim();
  const type = document.getElementById("type").value;
  const severity = document.getElementById("severity").value;
  const memo = document.getElementById("memo").value.trim();

  if (!place || !type || !severity) {
    alert("장소, 위험 유형, 위험 정도를 모두 입력하세요.");
    return;
  }

  if (!selectedLocation) {
    alert("지도에서 위험 구간의 위치를 선택하세요.");
    return;
  }

  const record = {
    id: Date.now() + Math.random(),
    place,
    type,
    severity: Number(severity),
    memo,
    lat: selectedLocation.lat,
    lon: selectedLocation.lon,
    date: new Date().toLocaleDateString("ko-KR")
  };

  records.push(record);
  saveRecords();

  document.getElementById("place").value = "";
  document.getElementById("type").value = "";
  document.getElementById("severity").value = "";
  document.getElementById("memo").value = "";

  selectedLocation = null;

  if (selectedMarker) {
    map.removeLayer(selectedMarker);
    selectedMarker = null;
  }

  document.getElementById("selectedInfo").textContent =
    "선택된 위치가 없습니다.";

  renderAll();
  alert("위험 구간이 등록되었습니다.");
}

// 데이터 저장
function saveRecords() {
  localStorage.setItem("pedestrianSafetyRecords", JSON.stringify(records));
}

// 화면에 출력할 문자 처리
function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, function(char) {
    return {
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    }[char];
  });
}

// 위험 정도 표시
function severityText(value) {
  if (value === 1) return "낮음";
  if (value === 2) return "보통";
  return "높음";
}

// 위험 정도별 색상
function severityColor(value) {
  if (value === 1) return "#36a56b";
  if (value === 2) return "#e6a23c";
  return "#e05252";
}

// 기록 삭제
function deleteRecord(id) {
  records = records.filter(record => record.id !== id);
  saveRecords();
  renderAll();
}

// 전체 기록 삭제
function deleteAll() {
  if (!records.length) {
    alert("삭제할 기록이 없습니다.");
    return;
  }

  if (confirm("모든 기록을 삭제하시겠습니까?")) {
    records = [];
    saveRecords();
    renderAll();
  }
}

// 전체 화면 갱신
function renderAll() {
  renderStats();
  renderRecords();
  renderAnalysis();
  renderMarkers();
}

// 현황 표시
function renderStats() {
  document.getElementById("totalCount").textContent = records.length;

  document.getElementById("highCount").textContent =
    records.filter(record => record.severity === 3).length;
}

// 기록 목록 표시
function renderRecords() {
  const list = document.getElementById("recordList");

  if (!records.length) {
    list.textContent = "등록된 기록이 없습니다.";
    return;
  }

  list.innerHTML = records.slice().reverse().map(record => `
    <div class="record">
      <div class="record-top">
        <strong>${escapeHTML(record.place)}</strong>
        <button onclick="deleteRecord(${record.id})">삭제</button>
      </div>
      <p>위험 유형: ${escapeHTML(record.type)}</p>
      <p>위험 정도:
        <span class="${record.severity === 1 ? "low" : record.severity === 2 ? "medium" : "high"}">
          ${severityText(record.severity)}
        </span>
      </p>
      <p>${escapeHTML(record.memo || "상세 내용 없음")}</p>
      <p class="info">${escapeHTML(record.date)}</p>
    </div>
  `).join("");
}

// 같은 장소의 기록 분석
function renderAnalysis() {
  const analysis = document.getElementById("analysis");

  if (!records.length) {
    analysis.textContent = "아직 등록된 기록이 없습니다.";
    return;
  }

  const groups = {};

  records.forEach(record => {
    const key = record.place.trim().toLowerCase();

    if (!groups[key]) {
      groups[key] = {
        place: record.place,
        count: 0,
        total: 0
      };
    }

    groups[key].count++;
    groups[key].total += record.severity;
  });

  const result = Object.values(groups).map(group => {
    const average = group.total / group.count;

    return {
      ...group,
      average,
      score: group.count * average
    };
  });

  result.sort((a, b) => b.score - a.score);

  analysis.innerHTML = result.map((item, index) => `
    <div class="analysis-item">
      <strong>${index + 1}위. ${escapeHTML(item.place)}</strong>
      <p>기록 횟수: ${item.count}회</p>
      <p>평균 위험도: ${item.average.toFixed(1)} / 3</p>
      <p>위험 우선순위 점수: ${item.score.toFixed(1)}</p>
    </div>
  `).join("");
}

// 지도에 위험 마커 표시
function renderMarkers() {
  recordMarkers.forEach(marker => map.removeLayer(marker));
  recordMarkers = [];

  records.forEach(record => {
    const marker = L.circleMarker(
      [record.lat, record.lon],
      {
        radius: 9,
        color: severityColor(record.severity),
        fillColor: severityColor(record.severity),
        fillOpacity: 0.8
      }
    ).addTo(map);

    marker.bindPopup(`
      <strong>${escapeHTML(record.place)}</strong><br>
      위험 유형: ${escapeHTML(record.type)}<br>
      위험 정도: ${severityText(record.severity)}<br>
      ${escapeHTML(record.memo)}
    `);

    recordMarkers.push(marker);
  });
}

// CSV 파일 저장
function downloadCSV() {
  if (!records.length) {
    alert("저장할 기록이 없습니다.");
    return;
  }

  const header = ["장소", "위험 유형", "위험 정도", "상세 내용", "위도", "경도", "등록 날짜"];

  const rows = records.map(record => [
    record.place,
    record.type,
    severityText(record.severity),
    record.memo,
    record.lat,
    record.lon,
    record.date
  ]);

  const csv = [header, ...rows]
    .map(row => row.map(value =>
      '"' + String(value).replace(/"/g, '""') + '"'
    ).join(","))
    .join("\n");

  const blob = new Blob(["\uFEFF" + csv], {
    type: "text/csv;charset=utf-8;"
  });

  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");

  link.href = url;
  link.download = "보행자_위험구간_기록.csv";
  link.click();

  URL.revokeObjectURL(url);
}

// 처음 화면 표시
renderAll();

</script>
</body>
</html>
